<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F3EFE8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Casa" />
  <title>Casa</title>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-fixed.jpg?v=3">
  <link rel="icon" type="image/png" href="apple-touch-icon-v3.png?v=3" />
  <link rel="manifest" href="manifest.webmanifest?v=2" />
  <link rel="stylesheet" href="styles.css?v=8" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">Casa oggi</div>
        <h1 id="page-title">Buon pomeriggio ☀️</h1>
      </div>
      <button class="icon-btn" id="history-btn" title="Storico">◷</button>
    </header>

    <main id="content"></main>

    <button class="fab" id="add-btn" aria-label="Aggiungi attività">＋</button>

    <nav class="bottom-nav">
      <button data-view="today" class="nav-item active"><span>⌂</span><small>Oggi</small></button>
      <button data-view="cleaning" class="nav-item"><span>✓</span><small>Pulizie</small></button>
      <button data-view="routines" class="nav-item"><span>◫</span><small>Routine</small></button>
      <button data-view="home" class="nav-item"><span>▦</span><small>Casa</small></button>
    </nav>
  </div>

  <dialog id="task-dialog">
    <form method="dialog" id="task-form">
      <div class="dialog-head">
        <h2>Nuova attività</h2>
        <button value="cancel" class="icon-btn">✕</button>
      </div>
      <label>Nome attività
        <input id="task-name" required placeholder="Es. Pulire filtro lavatrice">
      </label>
      <label>Stanza
        <select id="task-room">
          <option>Cucina</option><option>Bagno</option><option>Camera</option>
          <option>Soggiorno</option><option>Lavanderia</option><option>Terrazzo</option>
        </select>
      </label>
      <div class="segmented" id="type-picker">
        <button type="button" data-type="recurring" class="selected">Ricorrente</button>
        <button type="button" data-type="periodic">Periodica</button>
        <button type="button" data-type="once">Una tantum</button>
      </div>
      <label id="frequency-wrap">Ripeti ogni
        <select id="task-frequency">
          <option value="3">3 giorni</option>
          <option value="7" selected>1 settimana</option>
          <option value="14">2 settimane</option>
          <option value="30">1 mese</option>
          <option value="60">2 mesi</option>
          <option value="90">3 mesi</option>
        </select>
      </label>
      <label>Durata stimata
        <select id="task-duration">
          <option value="5">5 minuti</option><option value="10" selected>10 minuti</option>
          <option value="15">15 minuti</option><option value="30">30 minuti</option>
          <option value="60">60 minuti</option>
        </select>
      </label>
      <label>Note <span class="muted">(facoltative)</span>
        <textarea id="task-notes" placeholder="Es. usare anticalcare..."></textarea>
      </label>
      <button class="primary full" value="default" id="save-task">Salva</button>
    </form>
  </dialog>

  <dialog id="detail-dialog">
    <div id="detail-content"></div>
  </dialog>

  <script src="app.js?v=6"></script>
</body>
</html>
