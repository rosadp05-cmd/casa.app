<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F3EFE8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Casa"><title>Casa</title><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-fixed.jpg?v=3"><link rel="icon" href="apple-touch-icon-v3.png?v=3"><link rel="manifest" href="manifest.webmanifest?v=2"><link rel="stylesheet" href="styles.css?v=8"><style>.v2toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.v2toolbar button,.v2small{border:1px solid var(--line);border-radius:12px;background:white;padding:9px 12px;font-size:12px}.v2toolbar button.active{background:var(--blue);color:white}.v2muted{color:var(--muted);font-size:12px}.v2item{display:flex;align-items:center;gap:12px;padding:15px;border-bottom:1px solid var(--line)}.v2item:last-child{border:0}.v2item main{flex:1;min-width:0}.v2item strong{display:block;font-size:14px}.v2item small{display:block;color:var(--muted);margin-top:5px}.v2item button{flex-shrink:0}.v2calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.v2day{border:1px solid var(--line);border-radius:12px;background:white;padding:9px 1px;text-align:center;min-width:0;font-size:12px}.v2day.active{background:var(--blue);color:white}.v2day small{display:block;font-size:10px}.v2tag{display:inline-block;background:var(--blue-soft);padding:4px 8px;border-radius:9px;font-size:11px}.v2empty{padding:20px;text-align:center;color:var(--muted)}.v2actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.v2actions button{flex:1}.v2category{margin:20px 0 9px;font-weight:700;font-size:17px}#task-dialog{max-height:90dvh;overflow-y:auto}#task-form label{margin:11px 0}.v2hidden{display:none!important}.v2notice{background:var(--blue-soft);border-radius:15px;padding:14px;margin:12px 0;font-size:12px;color:var(--ink)}.v2item button:focus-visible,.v2day:focus-visible{outline:3px solid var(--blue)}</style></head><body><div id="app"><header class="topbar"><div><div class="eyebrow">Casa</div><h1 id="page-title">Le tue pulizie, con calma.</h1></div><button class="icon-btn" id="history-btn" aria-label="Storico">◷</button></header><main id="content"></main><button class="fab" id="add-btn" aria-label="Nuova attività">＋</button><nav class="bottom-nav"><button class="nav-item active" data-view="today"><span>⌂</span><small>Oggi</small></button><button class="nav-item" data-view="calendar"><span>▦</span><small>Calendario</small></button><button class="nav-item" data-view="tasks"><span>✓</span><small>Attività</small></button><button class="nav-item" data-view="ideas"><span>✧</span><small>Consigli</small></button></nav></div><dialog id="task-dialog"><form id="task-form"><div class="dialog-head"><h2 id="form-title">Nuova attività</h2><button type="button" class="icon-btn" id="close-task">✕</button></div><label>Attività<input id="task-name" required maxlength="120" placeholder="Es. Cambiare lenzuola"></label><label>Ambiente<select id="task-room"><option>Cucina</option><option>Bagno</option><option>Camera</option><option>Soggiorno</option><option>Lavanderia</option><option>Terrazzo</option><option>Altro</option></select></label><label>Programmazione<select id="task-mode"><option value="once">Una sola volta</option><option value="weekly">Giorno fisso della settimana</option><option value="fixed">Ogni X giorni da una data fissa</option><option value="after">Ogni X giorni dall'ultima esecuzione</option><option value="free">Senza scadenza</option></select></label><label id="date-wrap">Data di partenza / scadenza<input id="task-date" type="date"></label><label id="weekday-wrap">Giorno della settimana<select id="task-weekday"><option value="1">Lunedì</option><option value="2">Martedì</option><option value="3">Mercoledì</option><option value="4">Giovedì</option><option value="5">Venerdì</option><option value="6">Sabato</option><option value="0">Domenica</option></select></label><label id="interval-wrap">Ogni quanti giorni?<input id="task-interval" type="number" min="1" max="3650" value="30"></label><label>Note (facoltative)<textarea id="task-notes"></textarea></label><button class="primary full" type="submit">Salva attività</button></form></dialog><dialog id="detail-dialog"><div id="detail-content"></div></dialog><script src="app.js?v=20"></script></body></html>
